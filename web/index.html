<!doctype html>
<html lang="ru">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>Corporation</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Версия ресурсов для сброса кэша Telegram -->
  <link
    rel="stylesheet"
    href="/static/style.css?v=2"
  >

</head>


<body>

  <main class="app">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="hero">

      <div>

        <div class="eyebrow">
          МОЯ КОРПОРАЦИЯ
        </div>

        <h1 id="corpName">
          Загрузка...
        </h1>

      </div>


      <button
        class="icon"
        id="renameBtn"
        type="button"
      >
        ✏️
      </button>

    </header>



    <!-- =========================
         BALANCE
    ========================== -->

    <section class="balance">

      <div class="balance-label">
        КАПИТАЛ
      </div>


      <div
        class="money"
        id="money"
      >
        0 ₽
      </div>


      <div class="metrics">


        <div>

          <span>
            📈 Доход
          </span>

          <b id="income">
            0 ₽/ч
          </b>

        </div>


        <div>

          <span>
            🏢 Бизнесы
          </span>

          <b id="businessCount">
            0
          </b>

        </div>


      </div>


      <button
        class="collect"
        id="collectBtn"
        type="button"
      >
        💰 СОБРАТЬ ДОХОД
      </button>

    </section>



    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav
      class="tabs"
      aria-label="Разделы игры"
    >


      <button
        class="tab active"
        data-page="businesses"
        type="button"
      >
        🏭 Бизнесы
      </button>


      <button
        class="tab"
        data-page="techs"
        type="button"
      >
        🧪 Технологии
      </button>


      <button
        class="tab"
        data-page="investments"
        type="button"
      >
        💹 Инвестиции
      </button>


      <button
        class="tab"
        data-page="statistics"
        type="button"
      >
        📊 Статистика
      </button>


      <button
        class="tab"
        data-page="rating"
        type="button"
      >
        🏆 Рейтинг
      </button>


    </nav>



    <!-- =========================
         PAGE CONTENT
    ========================== -->

    <section id="content"></section>


  </main>



  <!-- =========================
       MODAL
  ========================== -->

  <div
    class="modal hidden"
    id="modal"
  >

    <div class="modal-card">


      <h2 id="modalTitle">
        Сообщение
      </h2>


      <p id="modalText"></p>


      <button
        id="modalClose"
        type="button"
      >
        Понятно
      </button>


    </div>

  </div>



  <!-- =========================
       APP JAVASCRIPT
  ========================== -->

  <script src="/static/app.js?v=2"></script>


</body>

</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Corporation</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/static/style.css?v=11">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div><div class="eyebrow">МОЯ КОРПОРАЦИЯ</div><h1 id="corpName">Загрузка...</h1></div>
      <button class="icon" id="renameBtn" type="button">✏️</button>
    </header>

    <section class="balance">
      <div class="balance-label">КАПИТАЛ</div>
      <div class="money" id="money">0 ₽</div>
      <div class="metrics three">
        <div><span>📈 Автодоход</span><b id="income">0 ₽/ч</b></div>
        <div><span>🏢 Бизнесы</span><b id="businessCount">0</b></div>
        <div><span>🏠 Недвижимость</span><b id="propertyCount">0</b></div>
      </div>
      <div class="auto-income-note">Доход начисляется автоматически</div>
    </section>

    <nav class="tabs" aria-label="Разделы игры">
      <button class="tab active" data-page="businesses" type="button">🏭 Бизнесы</button>
      <button class="tab" data-page="investments" type="button">💹 Инвестиции</button>
      <button class="tab" data-page="realestate" type="button">🏠 Недвижимость</button>
      <button class="tab" data-page="taxes" type="button">🧾 Налоги</button>
      <button class="tab" data-page="statistics" type="button">📊 Статистика</button>
      <button class="tab" data-page="rating" type="button">🏆 Рейтинг</button>
    </nav>
    <section id="content"></section>
  </main>

  <div class="modal hidden" id="modal"><div class="modal-card"><h2 id="modalTitle">Сообщение</h2><div id="modalText"></div><button id="modalClose" type="button">Понятно</button></div></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/static/app.js?v=11"></script>
</body>
</html>

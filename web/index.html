<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090a">
  <title>Corporation</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/static/style.css?v=13">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <div class="eyebrow">CORPORATION</div>
        <h1 id="corpName">Загрузка...</h1>
      </div>
      <button class="icon" id="renameBtn" type="button" aria-label="Переименовать">✎</button>
    </header>

    <section class="balance">
      <div class="balance-topline">
        <div>
          <div class="balance-label">ОБЩИЙ КАПИТАЛ</div>
          <div class="money" id="money">0 ₽</div>
        </div>
        <div class="gold-orb" aria-hidden="true"><span>₽</span></div>
      </div>

      <div class="metrics three">
        <div><span>Автодоход</span><b id="income">0 ₽/ч</b></div>
        <div><span>Бизнесы</span><b id="businessCount">0</b></div>
        <div><span>Недвижимость</span><b id="propertyCount">0</b></div>
      </div>
      <div class="auto-income-note"><span class="live-dot"></span> Доход начисляется автоматически</div>
    </section>

    <section id="content"></section>

    <nav class="tabs" aria-label="Разделы игры">
      <button class="tab active" data-page="businesses" type="button"><span>▣</span><small>Бизнес</small></button>
      <button class="tab" data-page="investments" type="button"><span>⌁</span><small>Инвестиции</small></button>
      <button class="tab tab-main" data-page="realestate" type="button"><span>◇</span><small>Активы</small></button>
      <button class="tab" data-page="taxes" type="button"><span>₽</span><small>Налоги</small></button>
      <button class="tab" data-page="statistics" type="button"><span>▥</span><small>Статистика</small></button>
      <button class="tab" data-page="rating" type="button"><span>♛</span><small>Рейтинг</small></button>
    </nav>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <div class="modal-handle"></div>
      <h2 id="modalTitle">Сообщение</h2>
      <div id="modalText"></div>
      <button id="modalClose" type="button">Готово</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/static/app.js?v=13"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090a">
  <title>Corporation</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css?v=263">
  <link rel="stylesheet" href="/static/premium_v24.css?v=263">
  <link rel="stylesheet" href="/static/interactive_map.css?v=263">
  <link rel="stylesheet" href="/static/premium_v25.css?v=263">
  <style>.rating-page{padding-bottom:120px}.rating-page>.grid{padding-right:68px}</style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <div class="eyebrow">CORPORATION</div>
        <h1 id="corpName">Загрузка...</h1>
      </div>
      <button class="icon" id="renameBtn" type="button" aria-label="Переименовать">✎</button>
    </header>

    <section class="balance">
      <div class="balance-topline">
        <div>
          <div class="balance-label">СВОБОДНЫЕ ДЕНЬГИ</div>
          <div class="money" id="money">0 ₽</div>
        </div>
        <div class="gold-orb" aria-hidden="true"><span>₽</span></div>
      </div>

      <div class="metrics three">
        <div><span>Автодоход</span><b id="income">0 ₽/ч</b></div>
        <div><span>Бизнесы</span><b id="businessCount">0</b></div>
        <div><span>Недвижимость</span><b id="propertyCount">0</b></div>
      </div>
      <div class="auto-income-note"><span class="live-dot"></span> Доход начисляется автоматически</div>
    </section>

    <section id="content"></section>

    <nav class="tabs" aria-label="Разделы игры">
      <button class="tab active" data-page="businesses" type="button" aria-label="Бизнес">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 21V8l8-5 8 5v13H4Z"/><path d="M8 21v-6h8v6M9 10h.01M15 10h.01"/></svg>
        </span>
        <span class="nav-label">Бизнес</span>
      </button>
      <button class="tab" data-page="investments" type="button" aria-label="Инвестиции">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 18 9 13l4 3 7-9"/><path d="M15 7h5v5"/></svg>
        </span>
        <span class="nav-label">Биржа</span>
      </button>
      <button class="tab" data-page="realestate" type="button" aria-label="Недвижимость">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="m3 11 9-7 9 7"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg>
        </span>
        <span class="nav-label">Объекты</span>
      </button>
      <button class="tab" data-page="taxes" type="button" aria-label="Налоги">
        <span class="nav-icon nav-ruble" aria-hidden="true">₽</span>
        <span class="nav-label">Налоги</span>
      </button>
      <button class="tab" data-page="statistics" type="button" aria-label="Статистика">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 20V11h4v9H5ZM10 20V5h4v15h-4ZM15 20v-7h4v7h-4Z"/></svg>
        </span>
        <span class="nav-label">Капитал</span>
      </button>
      <button class="tab" data-page="rating" type="button" aria-label="Рейтинг">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M8 4h8v3a4 4 0 0 1-8 0V4Z"/><path d="M8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 11v5M8 20h8M10 16h4v4"/></svg>
        </span>
        <span class="nav-label">Рейтинг</span>
      </button>
    </nav>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <div class="modal-handle"></div>
      <h2 id="modalTitle">Сообщение</h2>
      <div id="modalText"></div>
      <button id="modalClose" type="button">Готово</button>
    </div>
  </div>

  <script src="/static/app.js?v=263"></script>
  <script src="/static/v22_1.js?v=263"></script>
  <script src="/static/v20.js?v=263"></script>
  <script src="/static/v22.js?v=263"></script>
  <script src="/static/v22_performance.js?v=263"></script>
  <script src="/static/audit_v23.js?v=263"></script>
  <script src="/static/interactive_map.js?v=263"></script>
  <script src="/static/premium_v24.js?v=263"></script>
  <script src="/static/premium_v25.js?v=263"></script>
</body>
</html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0d0f10;color:#f4f4ef;font-family:Inter,system-ui,sans-serif;padding:18px}.wrap{max-width:620px;margin:auto}.eyebrow{color:#d9bf85;font-size:11px;font-weight:900;letter-spacing:1.3px}.card{background:#151819;border:1px solid #2a2e2f;border-radius:18px;padding:16px;margin:12px 0}.menu{display:grid;gap:10px}.menu button,.back{width:100%;padding:15px;border-radius:14px;border:1px solid #34393a;background:#1b1f20;color:#fff;text-align:left;font-weight:800}.gold{background:linear-gradient(135deg,#b89555,#dfc993)!important;color:#17130a!important}.row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #282c2d}.row:last-child{border-bottom:0}.row small{color:#92999a}.rank{font-weight:900;color:#d9bf85}.hidden{display:none}h1,h2{margin:6px 0 12px}p{color:#9da3a4}.muted{color:#92999a;font-size:12px}</style></head><body><div class="wrap"><div class="eyebrow">CORPORATION</div><h1>🏆 Сезоны</h1><section id="menu"><div class="menu"><button class="gold" id="currentBtn">Текущий сезон</button><button id="prevBtn">Предыдущие сезоны</button></div></section><section id="content" class="hidden"></section></div><script>
function escapeHTML(value){return String(value??'').replace(/[&<>"\']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const DEV_ID=999001;let data=null;function fmt(n){return Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽'}async function api(url){const h={};if(tg?.initData)h['X-Telegram-Init-Data']=tg.initData;else if(['localhost','127.0.0.1'].includes(location.hostname))h['X-User-Id']=String(DEV_ID);else throw new Error('Открой игру через Telegram');const r=await fetch(url,{headers:h,cache:'no-store'});if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.detail||'Ошибка')}return r.json()}function row(x,i){return `<div class="row"><div><span class="rank">#${x.place||i+1}</span> <b>${escapeHTML(x.corp_name)}</b><br><small>@${escapeHTML(x.username||'—')}</small></div><div><b>${fmt(Number(x.capital)>0?x.capital:x.money)}</b><br><small>капитал</small></div></div>`}function show(html){document.querySelector('#menu').classList.add('hidden');const c=document.querySelector('#content');c.classList.remove('hidden');c.innerHTML=`<button class="back" onclick="back()">← Назад</button>${html}`}window.back=()=>{document.querySelector('#content').classList.add('hidden');document.querySelector('#menu').classList.remove('hidden')};document.querySelector('#currentBtn').onclick=()=>{const s=data.current;show(`<div class="card"><div class="eyebrow">ТЕКУЩИЙ СЕЗОН</div><h2>${escapeHTML(s.name)}</h2><p>Лидеры определяются по полной капитализации.</p>${s.leaders.length?s.leaders.map(row).join(''):'<p>Игроков пока нет.</p>'}</div>`)};document.querySelector('#prevBtn').onclick=()=>{const ids=Object.keys(data.previous).sort((a,b)=>Number(b)-Number(a));show(ids.length?ids.map(id=>{const name=data.meta?.[id]?.name||`Сезон №${id}`;return `<div class="card"><div class="eyebrow">ЗАВЕРШЁННЫЙ СЕЗОН</div><h2>${escapeHTML(name)}</h2>${data.previous[id].slice(0,20).map(row).join('')}</div>`}).join(''):'<div class="card"><p>Завершённых сезонов пока нет.</p></div>')};api('/api/seasons').then(x=>data=x).catch(e=>document.body.innerHTML=`<div class="wrap"><div class="card">${escapeHTML(e.message)}</div></div>`);</script></body></html>
